[package]
name = "fakkarni-vault"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
keepass = { version = "=0.15.2", features = ["save_kdbx4"] }
rust-argon2 = "3"
fs2 = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
url = "2"
uuid = "1"
zeroize = { version = "1", features = ["derive"] }
