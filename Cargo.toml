[workspace]
members = ["crates/vault-core", "crates/browser-bridge", "crates/native-host", "src-tauri"]
default-members = ["crates/vault-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[profile.release]
panic = "abort"
strip = true
lto = true
codegen-units = 1
