[package]
name = "fakkarni"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fakkarni-vault = { path = "../crates/vault-core" }
fakkarni-browser-bridge = { path = "../crates/browser-bridge" }
fakkarni-windows-hello = { path = "../crates/windows-hello" }
fakkarni-hello-enrollment = { path = "../crates/hello-enrollment" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
tempfile = "3"
zeroize = "1"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_RemoteDesktop", "Win32_System_Power", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
